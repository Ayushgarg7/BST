<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated BST Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/0c7fc75b05.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Background Ambient Effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header class="app-header">
        <h1><i class="fa-solid fa-network-wired"></i> BST Visualizer</h1>
    </header>

    <div class="controls-wrapper glass-panel">
        <div class="input-group">
            <input type="number" id="nodeValue" placeholder="Enter node value..." autocomplete="off">
            <button id="insertBtn" class="btn primary-btn"><i class="fa-solid fa-plus"></i> Insert</button>
            <button id="deleteBtn" class="btn danger-btn"><i class="fa-solid fa-trash"></i> Delete</button>
        </div>
        
        <div class="slider-group">
            <label for="speedSlider"><i class="fa-solid fa-gauge-high"></i> Animation Speed:</label>
            <input type="range" id="speedSlider" min="100" max="2000" value="800" dir="rtl">
        </div>
        
        <div id="statusMessage" class="status-message">Tree initialized. Ready for input.</div>
    </div>

    <!-- The actual visualization canvas -->
    <div id="tree-container">
        <!-- SVG Canvas for Lines -->
        <svg id="svg-canvas" width="100%" height="100%"></svg>
        <!-- Nodes will be injected here -->
    </div>

    <!-- Separate Site Footer -->
    <footer class="site-footer">
      <div class="footer-content">
        <div class="social-auth">
          <a href="https://github.com/Ayushgarg7" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.linkedin.com/in/ayush-garg-258784221/" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="mailto:ayushgarg1827@gmail.com" target="_blank" title="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <p>&copy; Ayush Kumar Garg. Algorithm Visualizer.</p>
      </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
